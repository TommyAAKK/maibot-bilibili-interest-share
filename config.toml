# ======================================================================
# 麦麦刷B站插件 配置文件
# ======================================================================
#
# 工作方式：每隔一段时间，插件按白名单聊天流的用户兴趣去 B 站搜索候选视频，
# 过滤掉官方物料和已经刷过的视频，用「规则打分 + LLM 语义判断」挑出最合适的，
# 抽几帧看画面、读弹幕和热门评论，最后用符合人设口吻的自然语言分享出去。
#
# 改完保存即可，MaiBot 会自动重载插件配置，不用重启。
# 每个配置项在 README.md 的「配置说明」里都有对应说明，配置项含义以本文件注释为准。
#
# 注意：这个文件必须存为 UTF-8（不要带 BOM），否则解析会报错。


# ======================================================================
# 插件基础开关
# ======================================================================

[plugin]
# 是否启用插件（false 时插件完全不工作）
enabled = true
# 配置版本号，由插件维护，一般不要手动改
config_version = "1.0.0"


# ======================================================================
# 自动分享频率
# ======================================================================

[schedule]
# 自动刷 B 站的间隔（分钟），可调范围 1 ~ 1440（1 分钟 ~ 24 小时）
interval_minutes = 60
# 每轮额外随机延迟（秒），避免每次都在整点触发；0 表示不抖动
jitter_seconds = 120
# 插件加载后是否立刻先跑一轮（测试时想马上看到效果就设 true）
run_on_start = true
# 只在指定时间段内自动分享，格式 "9:00-23:30"（支持跨午夜 "22:00-2:00"）；留空表示全天
active_hours = ""
# 每轮每个聊天流最多分享几个视频
max_share_per_round = 1
# 用户主动搜索（/bili-search 指令）的独立冷却（秒），与上面的自动频率互不影响
search_cooldown_seconds = 300


# ======================================================================
# 候选来源（从哪些地方捞视频）
# ======================================================================

[sources]
# 是否抓 B 站「热门」列表（热门里官方物料较多，默认关闭）
popular_enabled = false
# 抓热门时每页多少条（一般不用改）
popular_page_size = 20
# 抓热门时抓几页（页数越多候选越多，也越慢）
popular_pages = 1
# 是否按兴趣关键词搜索（主要来源，建议保持开启）
search_enabled = true
# 每个关键词搜索抓几页结果
search_pages = 1
# 每轮用几个兴趣关键词去搜
search_keywords_per_round = 3
# 搜索排序：留空表示综合排序；可选 "pubdate"（最新发布）、"click"（播放多）、"dm"（弹幕多）
search_order = ""
# 每次搜索之间的间隔（秒），别调太小，容易被 B 站风控
search_delay_seconds = 1.2
# 是否抓排行榜（未登录时接口常返回 -352，默认关闭；配置 cookie 后可尝试开启）
ranking_enabled = false
# 排行榜分区号，[0] 表示全站；其它分区号见 B 站排行榜接口
ranking_rids = [0]


# ======================================================================
# 主动分享的类别（可自行增删改）
# ======================================================================
# 每个类别会用自己的关键词去搜索，命中的视频会被打上类别标签；
# 聊天流配置里的 categories 可以只保留想分享的类别，留空表示不限。
# 下面四个是默认类别，想加就再复制一段 [[categories]]。

[[categories]]
# 类别名（聊天流配置里的 categories 要引用这个名字）
name = "新鲜资讯"
# 是否启用这个类别
enabled = true
# 这个类别用来搜索的关键词
keywords = ["科技资讯", "游戏资讯", "新游情报", "行业动态"]
# 这个类别的搜索排序：留空用 [sources] 的 search_order，"pubdate" 表示按最新发布
search_order = "pubdate"
# 这个类别每轮最多贡献几个分享（0 表示不单独限制，走全局上限）
max_share_per_round = 0
# 这个类别候选视频的最低播放量
min_play = 1000

[[categories]]
# 类别名
name = "社区创作"
# 是否启用这个类别
enabled = true
# 这个类别用来搜索的关键词
keywords = ["二创", "手书", "MMD", "同人动画", "剪辑"]
# 这个类别的搜索排序（留空用全局设置）
search_order = ""
# 这个类别每轮最多贡献几个分享（0 表示不单独限制）
max_share_per_round = 0
# 这个类别候选视频的最低播放量
min_play = 3000

[[categories]]
# 类别名
name = "玩家投稿"
# 是否启用这个类别
enabled = true
# 这个类别用来搜索的关键词
keywords = ["实况", "通关", "整活", "玩家投稿", "高光时刻"]
# 这个类别的搜索排序（留空用全局设置）
search_order = ""
# 这个类别每轮最多贡献几个分享（0 表示不单独限制）
max_share_per_round = 0
# 这个类别候选视频的最低播放量
min_play = 3000

[[categories]]
# 类别名
name = "外网搬运"
# 是否启用这个类别
enabled = true
# 这个类别用来搜索的关键词
keywords = ["搬运", "外网", "油管搬运", "海外"]
# 这个类别的搜索排序（留空用全局设置）
search_order = ""
# 这个类别每轮最多贡献几个分享（0 表示不单独限制）
max_share_per_round = 0
# 这个类别候选视频的最低播放量
min_play = 3000


# ======================================================================
# 兴趣画像（怎么判断「这个群对什么感兴趣」）
# ======================================================================

[interest]
# 是否根据聊天记录自动学习兴趣（关掉就只用配置里手写的 interests）
use_recent_chat = true
# 回看最近多少小时的聊天
lookback_hours = 48.0
# 每个聊天流最多读多少条消息
max_messages_per_stream = 200
# 自动提取的兴趣关键词数量上限
top_keywords = 12
# 关键词至少出现多少次才会被采用
keyword_min_count = 2
# 配置里手写兴趣词的权重（越高越优先手写兴趣）
explicit_weight = 3.0
# 自动提取兴趣词的权重
auto_weight = 1.0
# 是否让视频 tags 参与兴趣打分
use_tags = true
# 视频 tags 命中兴趣时的权重
tag_weight = 0.7
# 是否尝试读取视频 CC 字幕辅助判断（没有字幕时自动跳过）
use_subtitles = true
# 是否用 LLM 做语义判断（判断是否贴合兴趣、是否值得分享）
use_llm_judge = true
# LLM 任务名：对应宿主 config/model_config.toml 里的 [model_task_config.xxx]
llm_task_name = "planner"
# 每轮最多送几个候选给 LLM 判断（越多越慢、越费 token）
llm_max_candidates = 5
# LLM 温度，越低越稳定保守
llm_temperature = 0.3
# 额外停用词：从聊天记录提兴趣时想忽略的词，比如 ["哈哈", "什么"]
extra_stopwords = []


# ======================================================================
# 抽帧看画面（只对最终入选的视频做，需要 ffmpeg）
# ======================================================================

[vision]
# 是否抽帧识图（关掉就只靠标题/简介/tags/弹幕判断）
enabled = true
# 识图用的模型任务名；planner 一般是纯文本模型，所以默认用 vlm 任务
task_name = "vlm"
# 抽几帧
frame_count = 4
# 帧图片最大宽度（像素），越小越省 token
max_width = 640
# 下载视频用于抽帧的最大体积（MB），超过就跳过抽帧
max_download_mb = 80
# 下载 + 抽帧 + 识图的总超时（秒）
timeout_seconds = 90.0


# ======================================================================
# 弹幕 / 热门评论（帮助判断视频实际讲了什么）
# ======================================================================

[danmaku]
# 是否抓弹幕
danmaku_enabled = true
# 最多抓取多少条弹幕（原始数量）
danmaku_fetch_limit = 400
# 过滤后最多送多少条弹幕给 LLM
danmaku_limit = 40
# 是否抓热门评论
comments_enabled = true
# 最多送多少条热门评论给 LLM
comments_limit = 10
# 过滤 AI 鱼灾类弹幕/评论（模板夸赞、AI 生成声明、纯符号刷屏等）
filter_ai_spam = true


# ======================================================================
# 硬过滤（不符合的视频直接丢掉，不进打分）
# ======================================================================

[filter]
# 视频最短时长（秒），太短的跳过
min_duration_seconds = 60
# 视频最长时长（秒），太长的跳过
max_duration_seconds = 1800
# 最低播放量
min_play = 5000
# 最低点赞数
min_like = 100
# 只分享最近多少天内发布的视频；0 表示不限
max_age_days = 30.0
# 标题/简介命中这些词就跳过（广告、带货之类）
block_keywords = ["广告", "带货", "抽奖", "互粉", "三连", "付费课程"]
# 这些 UP 主的视频不分享（填 UP 主名字）
block_up_names = []
# 这些分区的视频不分享（填分区名，如 ["资讯", "影视"]）
exclude_partitions = []
# 是否排除主流官方视频（标题/简介命中下面的词就跳过）
exclude_official = true
# 判定为「官方物料」的关键词列表
official_keywords = [
    "官方",
    "预告",
    "PV",
    "正片",
    "发布会",
    "宣传片",
    "定档",
    "首曝",
    "概念片",
    "实机演示",
    "OP",
    "ED",
    "主题曲",
    "前瞻",
    "速览",
    "兑换码",
    "直播回放",
    "特别节目",
    "版本更新说明",
]


# ======================================================================
# 打分（规则分：兴趣命中 + 热度 + 新鲜度）
# ======================================================================

[scoring]
# 兴趣命中分的权重（标题/简介/分区/UP/tags 命中都算）
interest_weight = 1.0
# 标题命中兴趣词时的额外加成倍数
title_match_boost = 2.0
# 播放/点赞热度的权重
hot_weight = 1.0
# 新鲜度的权重
freshness_weight = 0.6
# 新鲜度按多少天内线性衰减
freshness_days = 7.0
# 入选最低分（纯规则分；开启 LLM 判断后还要通过 LLM）
min_score = 4.0
# 是否要求至少命中一个兴趣词（关掉会更容易分享，但容易跑题）
require_interest_match = true


# ======================================================================
# 人设语气（分享文案按 MaiBot 配置的人设来说）
# ======================================================================

[persona]
# 开启后，推荐语和自然语言介绍都会用下面读到的人设口吻生成
enabled = true
# 人设名；留空 = 自动读宿主 config/bot_config.toml 的 [bot].nickname
name = ""
# 人设性格；留空 = 自动读宿主 bot_config.toml 的 [personality].personality
personality = ""
# 说话风格；留空 = 自动读宿主 bot_config.toml 的 [personality].reply_style
reply_style = ""
# 额外的风格要求，追加在人设后面，比如「分享时别太啰嗦，最多两句话」
style_hint = ""
# 手动指定 bot_config.toml 路径；留空则从插件数据目录反推实例根目录
bot_config_path = ""
# 人设缓存秒数（宿主改人设后最多这么久生效；0 表示每次都重新读）
cache_seconds = 120


# ======================================================================
# 分享格式（发出去长什么样）
# ======================================================================

[share]
# 是否先用一句人设口吻的推荐语开场（如「这个我觉得你们会喜欢！」）
intro_enabled = true
# 推荐语最大字数
intro_max_chars = 40
# 是否按「推荐语 / 标题+链接 / 自然语言介绍」分条发送（false 则合并成一条）
send_as_parts = true
# 分条发送时每两条之间的间隔（秒）
part_delay_seconds = 0.8
# 是否发一段人设口吻的自然语言介绍（把「讲了什么」和「有什么好看」揉在一起，
# 不再用「内容：」「看点：」这类正式格式）
narrative_enabled = true
# 自然语言介绍的最大字数
narrative_max_chars = 160
# 是否额外发一条播放/点赞数据
include_stats_line = false


# ======================================================================
# 名单内视频重发（聊天里自然语言触发，如「把之前那个原神的再发一遍」）
# ======================================================================

[reshare]
# 是否允许在聊天里用自然语言让机器人重发分享过的视频
enabled = true
# 触发词：消息里要出现其中之一
trigger_keywords = ["再发一遍", "再发一次", "再分享", "重新发", "再来一遍", "再放一次", "再发下", "重发", "发一遍", "发一次"]
# 指向历史的词：消息里还要出现其中之一
history_keywords = ["之前", "上次", "那个", "刚才", "你发过", "你分享过", "前面"]
# 在多长时间内的分享记录里查找（天）
match_window_days = 60.0
# 标题模糊匹配的最低相似度（0 ~ 1，越低越宽松）
min_match_score = 0.25
# 重发后是否回一句确认（如「好，再发一遍～」）
reply_enabled = true


# ======================================================================
# /赤石视频 指令：抽象整活类（手动触发的「屎」视频分享）
# ======================================================================

[shiwei]
# 是否启用 /赤石视频 指令
enabled = true
# 该指令的冷却（秒），默认 10 分钟
cooldown_seconds = 600
# 一次最多分享几个
max_share = 1
# 用来搜索的关键词
keywords = ["抽象", "整活", "鬼畜", "离谱", "翻车", "整蛊", "土味", "迷惑行为", "逆天", "难绷", "典中典", "社死", "搞笑"]
# 每次用几个关键词去搜
search_keywords_per_round = 2
# 最低播放量
min_play = 20000
# 视频最短时长（秒）
min_duration_seconds = 10
# 视频最长时长（秒）
max_duration_seconds = 900
# 命中这些词就跳过（赤石视频里不要官方物料）
block_keywords = ["官方", "预告", "发布会", "宣传片"]


# ======================================================================
# 高级运行参数（一般不用改）
# ======================================================================

[advanced]
# 状态文件目录；留空使用插件默认数据目录（data/plugins/<插件ID>）
data_dir = ""
# 单次 B 站请求的超时（秒）
request_timeout_seconds = 12.0
# 请求用的 User-Agent
user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
# 可选：填入 B 站 cookie 可提高搜索成功率（不要提交到公开仓库）
cookie = ""
# 可选：自定义 ffmpeg 路径；留空自动查找（imageio-ffmpeg / PATH）
ffmpeg_path = ""
# 同一视频多少天内不重复分享
dedupe_days = 30
# 最多保留多少条已分享记录（超过会淘汰最旧的）
max_seen_records = 3000
# 是否输出调试日志（排查问题时打开）
debug = false


# ======================================================================
# 白名单聊天流（可以配置多个，每段 [[streams]] 一个）
# ======================================================================
# stream_id 可以留空，插件会按 group_id / user_id 自动查找对应的聊天流。

[[streams]]
# 备注名，方便自己识别（只用于日志和状态显示）
name = "示例群"
# 是否启用这个聊天流（false 时不会往这里分享）
enabled = false
# 聊天流 ID（MaiBot 的 session_id）；填了优先级最高，一般留空让插件自己找
stream_id = ""
# 群号：想分享到群就填这个（QQ 群号）
group_id = "123456789"
# 私聊用户 ID：想分享给某个人就填这个（填了 group_id 就不用填）
user_id = ""
# 这个群感兴趣的方向（手写，权重最高）
interests = ["原神", "编程", "机械键盘", "猫咪"]
# 只分享这些类别（对应 [[categories]].name）；留空表示所有启用的类别都可以
categories = []
# 是否自动从群聊记录里学习兴趣（需要 [interest].use_recent_chat = true）
auto_interest = true
# 这个群每轮最多分享几个（0 表示用 [schedule] 的全局值）
max_share_per_round = 0
